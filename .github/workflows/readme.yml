name: Refresh profile README

on:
  # Every push to this repo (the bot's own commits use GITHUB_TOKEN and do not re-trigger).
  push:
    branches: [main]
  # Pushes to your other repos: picked up within the hour.
  schedule:
    - cron: "7 * * * *"
  # Instant refresh from another repo, see the note at the end of this file.
  repository_dispatch:
    types: [refresh-readme]
  workflow_dispatch:

permissions:
  contents: write

# Never run two refreshes at once; a newer trigger replaces a waiting one.
concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate README and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile
          if git diff --cached --quiet; then
            echo "README already up to date."
            exit 0
          fi
          git commit -m "Refresh profile stats"
          # Someone may have pushed while we were generating: replay on top and retry.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

