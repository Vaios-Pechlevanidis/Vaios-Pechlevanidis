  <radialGradient id="gg" cx="78%" cy="0%" r="40%"><stop offset="0" stop-color="#2ea043" stop-opacity=".2"/><stop offset="1" stop-color="#2ea043" stop-opacity="0"/></radialGradient>
  <radialGradient id="gp" cx="58%" cy="108%" r="40%"><stop offset="0" stop-color="#8957e5" stop-opacity=".38"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
  <radialGradient id="gt" cx="104%" cy="62%" r="32%"><stop offset="0" stop-color="#1b8fa8" stop-opacity=".32"/><stop offset="1" stop-color="#1b8fa8" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="840" height="222" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="840" height="222" fill="#0a0d13"/>
  <rect width="840" height="222" fill="url(#gb)"/><rect width="840" height="222" fill="url(#gg)"/>
  <rect width="840" height="222" fill="url(#gp)"/><rect width="840" height="222" fill="url(#gt)"/>
</g>
