<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="222" viewBox="0 0 840 222" role="img" aria-label="Vaios Pechlevanidis – GitHub stats">
<title>Vaios Pechlevanidis – GitHub stats</title>
<style>
  .s{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .fade{opacity:0;animation:fade .8s ease-out forwards}
  .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}
  .blink{animation:blink 1.05s steps(1) infinite}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @keyframes grow{to{transform:scaleX(1)}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .fade{opacity:1!important;animation:none!important}
    .grow{transform:none!important;animation:none!important}
    .blink{animation:none!important}
  }
</style>
<defs>
