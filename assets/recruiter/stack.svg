<svg xmlns="http://www.w3.org/2000/svg" width="840" height="328" viewBox="0 0 840 328" role="img" aria-label="Language Stack">
<title>Language Stack</title>
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .muted{fill:#8b949e}
  .fade{opacity:0;animation:fade .7s ease-out forwards}
  .grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);
        animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
  .pop{opacity:0;animation:pop .4s ease-out forwards}
  .ring{stroke-dasharray:0 200;animation:ring 1.2s ease-out forwards}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes grow{to{transform:scaleX(1)}}
  @keyframes pop{to{opacity:1}}
  @keyframes ring{to{stroke-dasharray:var(--d) 200}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .fade,.pop{opacity:1!important;animation:none!important}
    .grow{transform:none!important;animation:none!important}
    .ring{stroke-dasharray:var(--d) 200!important;animation:none!important}
  }
</style>

<defs>
  <radialGradient id="g1" cx="78%" cy="0%" r="55%"><stop offset="0" stop-color="#3fb950" stop-opacity=".22"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="50%" cy="105%" r="45%"><stop offset="0" stop-color="#8957e5" stop-opacity=".35"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3" cx="102%" cy="60%" r="35%"><stop offset="0" stop-color="#1f8fb3" stop-opacity=".28"/><stop offset="1" stop-color="#1f8fb3" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="840" height="328" rx="16"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="840" height="328" fill="#0d1117"/>
  <rect width="840" height="328" fill="url(#g1)"/><rect width="840" height="328" fill="url(#g2)"/><rect width="840" height="328" fill="url(#g3)"/>
</g>
<rect x=".5" y=".5" width="839" height="327" rx="16" fill="none" stroke="#263041"/>
<rect x="14.5" y="14.5" width="811" height="299" rx="11" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
<text x="34" y="52" class="t fade" font-size="20" font-weight="700">Language Stack</text>
<text x="34" y="72" class="t muted fade" font-size="12" letter-spacing=".4" style="animation-delay:.1s">Repository-weighted technologies</text>
<text x="800" y="52" text-anchor="end" class="t m" font-size="12" fill="#58a6ff" style="fill:#58a6ff">&gt; stack.scan<tspan class="blink"> _</tspan></text>
