<g class="fade" style="animation-delay:0.35s"><circle cx="40" cy="177" r="5" fill="#dea584"/><text x="54" y="181" class="t" font-size="13" font-weight="600">Rust</text><rect x="170" y="171" width="570" height="12" rx="6" fill="#111722" stroke="#263041"/><rect x="170" y="171" width="102.1" height="12" rx="6" fill="#dea584" class="grow" style="animation-delay:0.45s"/><text x="806" y="181" text-anchor="end" class="t m" font-size="12">17.9%</text></g>
<g class="fade" style="animation-delay:0.45s"><circle cx="40" cy="211" r="5" fill="#b07219"/><text x="54" y="215" class="t" font-size="13" font-weight="600">Java</text><rect x="170" y="205" width="570" height="12" rx="6" fill="#111722" stroke="#263041"/><rect x="170" y="205" width="12.6" height="12" rx="6" fill="#b07219" class="grow" style="animation-delay:0.55s"/><text x="806" y="215" text-anchor="end" class="t m" font-size="12">2.2%</text></g>
<g class="fade" style="animation-delay:0.55s"><circle cx="40" cy="245" r="5" fill="#3178c6"/><text x="54" y="249" class="t" font-size="13" font-weight="600">TypeScript</text><rect x="170" y="239" width="570" height="12" rx="6" fill="#111722" stroke="#263041"/><rect x="170" y="239" width="11.5" height="12" rx="6" fill="#3178c6" class="grow" style="animation-delay:0.65s"/><text x="806" y="249" text-anchor="end" class="t m" font-size="12">2.0%</text></g>
<g class="fade" style="animation-delay:0.65s"><circle cx="40" cy="279" r="5" fill="#663399"/><text x="54" y="283" class="t" font-size="13" font-weight="600">CSS</text><rect x="170" y="273" width="570" height="12" rx="6" fill="#111722" stroke="#263041"/><rect x="170" y="273" width="5.2" height="12" rx="6" fill="#663399" class="grow" style="animation-delay:0.75s"/><text x="806" y="283" text-anchor="end" class="t m" font-size="12">0.9%</text></g>
</svg>
